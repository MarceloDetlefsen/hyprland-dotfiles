# =========================
# HYPRLAND NVIDIA CONFIG
# =========================

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/generated/colors.conf
# plugin = /var/cache/hyprpm/chelo/hyprland-plugins/hyprexpo.so
$mod = SUPER
monitor=,preferred,auto,1
monitor=eDP-1,1920x1080@144,0x0,1
monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# ---------- ENV ---------------
# env = KDE_SESSION_VERSION,6
# env = QT_QPA_PLATFORMTHEME,kde
env = XDG_MENU_PREFIX,plasma-

# --------- AUTOSTART ---------

# INPUT / HARDWARE
exec-once = ~/.config/hypr/scripts/numlockcontrol.sh sync

# SYSTEM SERVICES
exec-once = polkit-kde-agent
exec-once = nm-applet
# exec-once = ~/.config/hypr/scripts/ensure-deep-sleep.sh
exec-once = ~/.config/hypr/scripts/watch-suspend-events.sh

# PORTALS (CRÍTICO - ORDEN IMPORTA)
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal-gtk
exec-once = /usr/lib/xdg-desktop-portal

# CLIPBOARD
exec-once = wl-paste --watch cliphist store

# UI / BARS / NOTIFICATIONS
exec-once = /usr/bin/qs
exec-once = /usr/bin/mako

# HYPRLAND ECOSYSTEM
exec-once = hyprpaper
exec-once = hypridle

# CUSTOM
exec-once = ~/.config/hypr/scripts/battery-alert.sh

# OPTIONAL / PERSONAL
exec-once = musicpresence

# ABRIR GPARTED
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---------- INPUT ----------
input {
    kb_layout = latam
    numlock_by_default = true

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

# ---------- MOUSE (Logitech G203) ----------
device {
    name = logitech-g203-lightsync-gaming-mouse
    left_handed = true
}

device {
    name = logitech-g203-lightsync-gaming-mouse-keyboard-1
    left_handed = true
}

# ATRÁS (botón 275)
# bind = , mouse:275, exec, ydotool key 125:1 105:1 105:0 125:0

# ADELANTE (botón 276)
# bind = , mouse:276, exec, ydotool key 125:1 106:1 106:0 125:0

# ---------- GENERAL ----------
general {
    gaps_in = 1
    gaps_out = 3
    border_size = 2
    layout = dwindle
}

windowrulev2 = idleinhibit fullscreen, fullscreen:1
windowrulev2 = fullscreen, class:^(HyprMagnifier)$

# ------- QUITAR FONDO OG ------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
    enable_swallow = true
    swallow_regex = "^(kitty)$"
}

# ---------- DWINDLE LAYOUT ----------
dwindle {
    preserve_split = yes
}

# ---------- DECORATION ----------
decoration {
    rounding = 7
    active_opacity = 1.0
    inactive_opacity = 0.9
    dim_inactive = false
    dim_strength = 0.19
    dim_around = 0.6
    shadow {
        enabled = true
        range = 3
        render_power = 17
        color = rgba(44220044)
    }
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
}

# ---------- ANIMATIONS ----------
animations {
    enabled = yes

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 3, smooth, popin 85%
    animation = windowsOut, 1, 3, smooth, popin 85%
    animation = windowsMove, 1, 3, smooth
    animation = fade, 1, 2, smooth
    animation = workspaces, 1, 3, smooth, slidefade 15%
}

# ---------- VOLUME CONTROLS ----------

# Subir volumen
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audiocontrol.sh i

# Bajar volumen
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audiocontrol.sh d

# Mute / Unmute
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/audiocontrol.sh m
bind = ALT, F5, exec, ~/.config/hypr/scripts/audiocontrol.sh m
# non-consuming so Hyprland still toggles the real Num Lock state
bindn = , code:77, exec, ~/.config/hypr/scripts/numlockcontrol.sh toggle

# ---------- BRIGHTNESS CONTROLS ----------

# Subir brillo
bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightnesscontrol.sh i

# Bajar brillo
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightnesscontrol.sh d

# ---------- SCREENSHOTS (ImpPnt) ----------
bind = $mod, P, exec, hyprshot -m output -c
bind = $mod SHIFT, P, exec, hyprshot -m region -c
bind = $mod CTRL, P, exec, hyprshot -m output -o ~/Imágenes
bind = $mod, M, exec, ~/.config/hypr/scripts/magnifier.sh
bind = $mod, T, exec, ~/.config/hypr/scripts/presentation-cursor.sh toggle

# ---------- CLIPHIST -----------
bind = $mod, V, exec, sh -c "cliphist list | wofi --dmenu | cliphist decode | wl-copy"

# ---------- CAVA ----------
exec-once = cava &
exec-once = sleep 1 && hyprctl dispatch togglefloating class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch resizewindowpixel exact 600 200,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch movewindowpixel exact 660 20,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch setopacity 0.8,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch border none,class:^(cava)$

# ---------- BINDS BÁSICOS ----------
bind = $mod, RETURN, exec, kitty
bind = $mod, D, exec, wofi --show drun --allow-images --no-actions  --width 600 --height 400
bind = $mod, N, exec, nwg-drawer
bind = $mod, S, global, quickshell:shaderDrawer
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod, R, exec, ~/.config/hypr/scripts/random-wallpaper.sh
bind = $mod, B, exec, ~/.config/waybar/scripts/power-menu.sh
bind = $mod SHIFT, Q, exit
bind = ALT, F4, exec, hyprctl layers | grep -q power-menu || quickshell -p ~/.config/quickshell/utils/PowerMenu.qml
bind = $mod, E, exec, dolphin
bind = $mod, Z, exec, gtk-launch zen
bind = $mod, C, exec, hyprpicker -a
bind = $mod SHIFT, A, exec, ~/.config/hypr/scripts/audio-output.sh
bind = $mod SHIFT ALT, L, exec, hyprlock
bind = $mod, O, exec, ~/.config/hypr/scripts/hdmi-mode.sh

# ---------- WORKSPACES ----------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Crear / ir al siguiente workspace disponible
bind = SUPER, equal, workspace, +1

# Borrar workspace actual (solo si está vacío)
bind = SUPER, minus, exec, hyprctl dispatch workspace empty

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# ---------- MOVER FOCO (VIM STYLE) ----------
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, J, movefocus, u
bind = $mod, K, movefocus, d

# ---------- MOVER VENTANAS ----------
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, J, movewindow, u
bind = $mod SHIFT, K, movewindow, d

# ---------- RESIZE VENTANA ACTIVA ----------
bind = $mod SHIFT, left,  resizeactive, -30 0
bind = $mod SHIFT, right, resizeactive,  30 0
bind = $mod SHIFT, up,    resizeactive,  0 -30
bind = $mod SHIFT, down,  resizeactive,  0  30

# ------ MOVER CON MOUSE -------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ------ Windows Tab LIke ------
# bind = $mod, TAB, hyprexpo:expo

# =========================
# MOVER LIBRE (SIN TILING)
# =========================

# Toggle flotante para mover sin que Hyprland razone layout
bind = $mod SHIFT, M, togglefloating

