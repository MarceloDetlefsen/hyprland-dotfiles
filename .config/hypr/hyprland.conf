# =========================
# HYPRLAND NVIDIA CONFIG
# =========================

source = ~/.config/hypr/env.conf
# plugin = /var/cache/hyprpm/chelo/hyprland-plugins/hyprexpo.so
$mod = SUPER
monitor=,preferred,auto,1
monitor=eDP-1,1920x1080@144,0x0,1
monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# ---------- ENV ---------------
# env = KDE_SESSION_VERSION,6
# env = QT_QPA_PLATFORMTHEME,kde
# env = XDG_MENU_PREFIX,plasma-

# --------- AUTOSTART ---------

# INPUT / HARDWARE
exec-once = numlockx on

# SYSTEM SERVICES
exec-once = polkit-kde-agent
exec-once = nm-applet
# exec-once = /home/chelo/.config/hypr/scripts/ensure-deep-sleep.sh
exec-once = /home/chelo/.config/hypr/scripts/watch-suspend-events.sh

# PORTALS (CRÍTICO - ORDEN IMPORTA)
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal-gtk
exec-once = /usr/lib/xdg-desktop-portal

# CLIPBOARD
exec-once = wl-paste --watch cliphist store

# UI / BARS / NOTIFICATIONS
exec-once = waybar
exec-once = mako

# HYPRLAND ECOSYSTEM
exec-once = hyprpaper

exec-once = swayidle -w \
before-sleep '/home/chelo/.config/hypr/scripts/lock-session.sh' \
timeout 600 '/home/chelo/.config/hypr/scripts/lock-session.sh' \
timeout 900 '/home/chelo/.config/hypr/scripts/suspend-deep.sh'

# CUSTOM
exec-once = ~/.config/hypr/scripts/battery-alert.sh

# OPTIONAL / PERSONAL
exec-once = musicpresence

# ABRIR GPARTED
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---------- INPUT ----------
input {
    kb_layout = latam

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

# ---------- MOUSE (Logitech G203) ----------
device {
    name = logitech-g203-lightsync-gaming-mouse
    left_handed = true
}

device {
    name = logitech-g203-lightsync-gaming-mouse-keyboard-1
    left_handed = true
}

# ATRÁS (botón 275)
# bind = , mouse:275, exec, ydotool key 125:1 105:1 105:0 125:0

# ADELANTE (botón 276)
# bind = , mouse:276, exec, ydotool key 125:1 106:1 106:0 125:0

# ---------- GENERAL ----------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(89b4fa)
    col.inactive_border = rgb(313244)
    layout = dwindle
}

# ------- QUITAR FONDO OG ------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---------- DWINDLE LAYOUT ----------
dwindle {
    preserve_split = yes
}

# ---------- DECORATION ----------
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

# ---------- ANIMATIONS ----------
animations {
    enabled = yes

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, default
    animation = workspaces, 1, 4, smooth
}

# ---------- VOLUME CONTROLS ----------

# Subir volumen
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

# Bajar volumen
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

# Mute / Unmute
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# ---------- BRIGHTNESS CONTROLS ----------

# Subir brillo
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%

# Bajar brillo
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ---------- SCREENSHOTS (ImpPnt) ----------
bind = $mod, P, exec, hyprshot -m output -c
bind = $mod SHIFT, P, exec, hyprshot -m region -c
bind = $mod CTRL, P, exec, hyprshot -m output -o ~/Imágenes

# ---------- CLIPHIST -----------
bind = $mod, V, exec, sh -c "cliphist list | wofi --dmenu | cliphist decode | wl-copy"

# ---------- CAVA ----------
exec-once = cava &
exec-once = sleep 1 && hyprctl dispatch togglefloating class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch resizewindowpixel exact 600 200,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch movewindowpixel exact 660 20,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch setopacity 0.8,class:^(cava)$
exec-once = sleep 1 && hyprctl dispatch border none,class:^(cava)$

# ---------- BINDS BÁSICOS ----------
bind = $mod, RETURN, exec, kitty
bind = $mod, D, exec, wofi --show drun --allow-images --no-actions  --width 600 --height 400
bind = $mod, N, exec, nwg-drawer
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod, R, exec, ~/.config/hypr/scripts/random-wallpaper.sh
bind = $mod SHIFT, Q, exit
bind = $mod, E, exec, dolphin
bind = $mod, Z, exec, gtk-launch zen
bind = $mod, C, exec, hyprpicker -a
bind = $mod SHIFT, A, exec, ~/.config/hypr/scripts/audio-output.sh
bind = $mod SHIFT ALT, L, exec, hyprlock
bind = $mod, O, exec, ~/.config/hypr/scripts/hdmi-mode.sh

# ---------- WORKSPACES ----------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Crear / ir al siguiente workspace disponible
bind = SUPER, equal, workspace, +1

# Borrar workspace actual (solo si está vacío)
bind = SUPER, minus, exec, hyprctl dispatch workspace empty

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# ---------- MOVER FOCO (VIM STYLE) ----------
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, J, movefocus, u
bind = $mod, K, movefocus, d

# ---------- MOVER VENTANAS ----------
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, J, movewindow, u
bind = $mod SHIFT, K, movewindow, d

# ---------- RESIZE VENTANA ACTIVA ----------
bind = $mod SHIFT, left,  resizeactive, -30 0
bind = $mod SHIFT, right, resizeactive,  30 0
bind = $mod SHIFT, up,    resizeactive,  0 -30
bind = $mod SHIFT, down,  resizeactive,  0  30

# ------ MOVER CON MOUSE -------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ------ Windows Tab LIke ------
# bind = $mod, TAB, hyprexpo:expo

# =========================
# MOVER LIBRE (SIN TILING)
# =========================

# Toggle flotante para mover sin que Hyprland razone layout
bind = $mod SHIFT, M, togglefloating
